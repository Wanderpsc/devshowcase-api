services:
  - type: web
    name: devshowcase-api
    runtime: node
    branch: atividade-2
    plan: free
    buildCommand: npm ci && npm run db:init
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: devshowcase-db
          property: connectionString

databases:
  - name: devshowcase-db
    plan: free
    databaseName: devshowcase
    user: devshowcase